plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.20'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.moefactory.bettermiuiexpress'

    // libxposed api / service / interface 102.0.0 are all published with
    // minCompileSdk=37, so the compile SDK has to be at least 37 even though
    // targetSdk stays at 35 (runtime behaviour is unchanged by this).
    //
    // 注意：SDK 仓库里 API 37 只有带小版本的包（platforms;android-37.0），
    // 没有裸 android-37。AGP 的 hash string 是 "android-<api>[.<minor>]"，
    // 必须显式给出 compileSdkMinor 才会生成 "android-37.0"，
    // 否则会报 Failed to find target with hash string 'android-37'。
    compileSdk = 37
    compileSdkMinor = 0
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId "com.moefactory.bettermiuiexpress"
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName "1.7.4"
        resConfigs 'zh'
        generatedDensities = []
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Signing is optional: when local.properties does not define an existing
        // keystore the build still configures and produces an unsigned APK rather
        // than failing during configuration.
        def signingPropertiesFile = rootProject.file('local.properties')
        def signingProperties = new Properties()
        if (signingPropertiesFile.exists()) {
            signingPropertiesFile.withInputStream { signingProperties.load(it) }
        }
        def storeFilePath = signingProperties.getProperty('signing.storeFile')
        // file() resolves relative to the module directory, matching the original build.
        if (storeFilePath != null && storeFilePath.trim() && file(storeFilePath).exists()) {
            debug {
                storeFile file(storeFilePath)
                storePassword signingProperties.getProperty('signing.storePassword')
                keyPassword signingProperties.getProperty('signing.keyPassword')
                keyAlias signingProperties.getProperty('signing.keyAlias')
            }
            release {
                storeFile file(storeFilePath)
                storePassword signingProperties.getProperty('signing.storePassword')
                keyPassword signingProperties.getProperty('signing.keyPassword')
                keyAlias signingProperties.getProperty('signing.keyAlias')
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'mozilla/public-suffix-list.txt'
    }
}

dependencies {
    // ---- Modern Xposed API (LSPosed API 102) ----
    // api: compile only - the framework provides these classes at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // service: bundled into the APK. It also merges the XposedService provider
    // (authorities ${applicationId}.XposedService) needed by the module app to
    // talk to the framework and to publish remote preferences.
    implementation 'io.github.libxposed:service:102.0.0'

    // ---- App side ----
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.github.vipulasri:timelineview:1.2.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'com.github.liangjingkanji:BRV:1.6.1'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
}
